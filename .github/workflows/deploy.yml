name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # When deploying to https://<user>.github.io/<repo>/ this needs to
          # be "/<repo>/". When the repo is the user/org site
          # (https://<user>.github.io) leave it as "/".
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}
          VITE_SHEET_ENDPOINT: ${{ secrets.VITE_SHEET_ENDPOINT }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
